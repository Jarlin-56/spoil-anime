name: CI Regression Gates & Media Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'phase*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run network-dependent live Edge-TTS integration suite'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-regression-gates:
    name: Regression Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Media Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fontconfig fonts-thai-tlwg

      - name: Verify FFmpeg and FFprobe Availability
        shell: bash
        run: |
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2

      - name: Install Node.js Dependencies (Reproducible npm ci)
        run: npm ci

      - name: Install Python Dependencies (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Fast Deterministic Checks
        run: node scripts/verify_pipeline.js --fast

      - name: Security & Failure-Recovery Regression Suite
        run: node scripts/verify_pipeline.js --security

      - name: Media Integration & A/V Sync Suite
        run: node scripts/verify_pipeline.js --media

  live-external-integration:
    name: Live External Integration (Edge-TTS)
    if: github.event_name == 'workflow_dispatch' && inputs.run_live == true
    runs-on: ubuntu-latest
    needs: deterministic-regression-gates

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Execute Live Edge-TTS Suite
        run: node scripts/verify_pipeline.js --live
